{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-xl rounded-3xl bg-white p-8 shadow-sm border">
  <h1 class="text-2xl font-semibold">Create Account</h1>
  <p class="mt-2 text-slate-600">Register to access prediction tools.</p>

  <form class="mt-6 space-y-4" method="POST">
    <div>
      <label class="text-sm font-medium">Full Name</label>
      <input name="full_name" type="text" required
             class="mt-1 w-full rounded-xl border px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <div>
      <label class="text-sm font-medium">Email</label>
      <input name="email" type="email" required
             class="mt-1 w-full rounded-xl border px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <div>
      <label class="text-sm font-medium">Password</label>
      <input name="password" type="password" minlength="6" required
             class="mt-1 w-full rounded-xl border px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <p class="mt-1 text-xs text-slate-500">Minimum 6 characters.</p>
    </div>
    <button class="w-full rounded-xl bg-indigo-600 px-4 py-3 text-white font-medium hover:bg-indigo-500">
      Register
    </button>
  </form>

  <p class="mt-4 text-sm text-slate-600">
    Already have an account?
    <a class="text-indigo-600 hover:underline" href="{{ url_for('login') }}">Login</a>
  </p>
</div>
{% endblock %}
